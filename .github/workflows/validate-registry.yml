name: Extension Gatekeeper & SQLite Catalog Builder

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [ main ]
    paths:
      - 'authors/**'
  push:
    branches: [ main ]
    paths:
      - 'authors/**'
      - '.github/workflows/**'
      - 'blocklist.txt'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # ===========================================================================
  # JOB 1: Pull Request Gatekeeper (Security, Identity, & Auto-Merge)
  # ===========================================================================
  validate-and-merge:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Trusted Base Branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify PR Author Identity & Changed Files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: |
          cat << 'EOF' > verify_identity.js
          async function main() {
            const prAuthor = (process.env.PR_AUTHOR || "").toLowerCase().trim();
            const prNumber = process.env.PR_NUMBER;
            const repo = process.env.REPO_FULL_NAME;

            const headers = {
              "User-Agent": "Mirage-Gatekeeper",
              "Accept": "application/vnd.github.v3+json",
              "Authorization": `Bearer ${process.env.GITHUB_TOKEN}`
            };

            const res = await fetch(`https://api.github.com/repos/${repo}/pulls/${prNumber}/files?per_page=100`, { headers });
            if (!res.ok) {
              throw new Error(`Failed to fetch PR files (HTTP ${res.status}: ${res.statusText}).`);
            }

            const filesData = await res.json();
            console.log(`PR Author: @${prAuthor}`);
            console.log("Changed files:\n" + filesData.map(f => `${f.status}: ${f.filename}`).join("\n"));

            if (!Array.isArray(filesData) || filesData.length === 0) {
              throw new Error("No files were modified in this PR.");
            }

            for (const f of filesData) {
              const file = (f.filename || "").trim();

              if (f.status === "removed" || f.status === "renamed") {
                throw new Error(`SECURITY VIOLATION: Removing or renaming files via auto-merge is not permitted (${file}).`);
              }

              if (!file.startsWith("authors/") || !file.endsWith(".json")) {
                throw new Error(`SECURITY VIOLATION: Pull requests can only add or modify files in authors/<author>/*.json. Forbidden file: ${file}`);
              }

              const parts = file.split("/");
              if (parts.length !== 3) {
                throw new Error(`Invalid path structure: "${file}". Expected "authors/<author>/<id>.json".`);
              }

              const targetAuthor = parts[1].toLowerCase().trim();
              if (targetAuthor === "local" || targetAuthor === "mirage" || targetAuthor === "official") {
                throw new Error(`SECURITY VIOLATION: The author namespace "${targetAuthor}" is reserved.`);
              }

              if (targetAuthor !== prAuthor) {
                throw new Error(`SECURITY VIOLATION: User @${prAuthor} is not authorized to modify files under authors/${targetAuthor}/.`);
              }
            }

            console.log("✔ Identity verification passed: All modified files belong to @" + prAuthor);
          }

          main().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          EOF
          node verify_identity.js
          rm verify_identity.js

      - name: Validate App Version, SHA-256 Integrity, Release Assets & AST Static Security
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: |
          cat << 'EOF' > scan_security.js
          const path = require("path");
          const crypto = require("crypto");

          function compareSemver(aRaw, bRaw) {
            const parse = (raw) => {
              const clean = String(raw || "").trim().replace(/^v/i, "").split("+")[0];
              const dashIdx = clean.indexOf("-");
              const coreStr = dashIdx === -1 ? clean : clean.slice(0, dashIdx);
              const preStr = dashIdx === -1 ? "" : clean.slice(dashIdx + 1);
              const core = coreStr.split(".").map((n) => parseInt(n, 10) || 0);
              while (core.length < 3) core.push(0);
              const pre = preStr ? preStr.split(".") : [];
              return { core, pre };
            };

            const a = parse(aRaw);
            const b = parse(bRaw);

            for (let i = 0; i < 3; i++) {
              if (a.core[i] > b.core[i]) return 1;
              if (a.core[i] < b.core[i]) return -1;
            }

            if (a.pre.length === 0 && b.pre.length === 0) return 0;
            if (a.pre.length === 0) return 1;
            if (b.pre.length === 0) return -1;

            const len = Math.max(a.pre.length, b.pre.length);
            for (let i = 0; i < len; i++) {
              const segA = a.pre[i];
              const segB = b.pre[i];
              if (segA === undefined) return -1;
              if (segB === undefined) return 1;

              const isNumA = /^\d+$/.test(segA);
              const isNumB = /^\d+$/.test(segB);

              if (isNumA && isNumB) {
                const nA = parseInt(segA, 10);
                const nB = parseInt(segB, 10);
                if (nA > nB) return 1;
                if (nA < nB) return -1;
              } else if (isNumA !== isNumB) {
                return isNumA ? -1 : 1;
              } else {
                if (segA > segB) return 1;
                if (segA < segB) return -1;
              }
            }
            return 0;
          }

          async function getLatestMirageVersion(headers) {
            const relRes = await fetch("https://api.github.com/repos/VenturaNotes/mirage-editor/releases?per_page=20", { headers });
            if (!relRes.ok) {
              throw new Error(`Could not fetch latest Mirage Editor release (HTTP ${relRes.status}: ${relRes.statusText}).`);
            }

            const releases = await relRes.json();
            const versions = releases
              .filter((r) => !r.draft && typeof r.tag_name === "string" && /^v?\d+\.\d+\.\d+/i.test(r.tag_name.trim()))
              .map((r) => r.tag_name.trim().replace(/^v/i, ""))
              .sort((a, b) => compareSemver(b, a));

            if (versions.length === 0) {
              throw new Error("No published Mirage Editor releases found on GitHub.");
            }
            return versions[0];
          }

          function scanSecurity(code, filename) {
            if (/\beval\s*\(|\bnew\s+Function\s*\(|\bwindow\.eval\b|\bglobalThis\.eval\b/.test(code)) {
              throw new Error(`SECURITY VIOLATION in ${filename}: Dynamic code evaluation (eval / new Function) is prohibited.`);
            }

            if (/import\s*\(\s*["']https?:\/\//i.test(code) || /require\s*\(\s*["']https?:\/\//i.test(code)) {
              throw new Error(`SECURITY VIOLATION in ${filename}: Dynamic remote import detected. Dependencies must be bundled.`);
            }

            if (/eval\s*\(\s*(await\s+)?fetch\s*\(/i.test(code)) {
              throw new Error(`SECURITY VIOLATION in ${filename}: Remote fetch-to-eval detected.`);
            }

            if (/\\x[0-9a-fA-F]{2}\\x[0-9a-fA-F]{2}\\x[0-9a-fA-F]{2}/.test(code) && code.length > 5000) {
              const hexDensity = (code.match(/\\x[0-9a-fA-F]{2}/g) || []).length / code.length;
              if (hexDensity > 0.05) {
                throw new Error(`SECURITY VIOLATION in ${filename}: Obfuscated hex payloads detected. Code must be published in human-readable form.`);
              }
            }
          }

          function deriveCapabilities(code) {
            const caps = new Set();
            if (/\bfetch\s*\(|\bhttps?:|\bWebSocket\s*\(|\bXMLHttpRequest\b/.test(code)) caps.add("network-access");
            if (/\bchild_process\b|\bexec\s*\(|\bspawn\s*\(|\bnode-pty\b/.test(code)) caps.add("terminal-execution");
            if (/\bnew\s+Audio\b|\bAudioContext\b|["'`]audio\//.test(code)) caps.add("audio");
            if (/\bclipboard\.(read|write)|\bnavigator\.clipboard\b/.test(code)) caps.add("clipboard");
            if (/statusBar\.addItem/.test(code)) caps.add("status-bar");
            if (/writeFile|readFile|unlink/.test(code)) caps.add("vault-write");
            if (!caps.has("network-access") && !caps.has("terminal-execution")) caps.add("vault-only");
            return Array.from(caps);
          }

          function validateRelativePath(rawFile) {
            const clean = String(rawFile || "").trim().replace(/\\/g, "/").replace(/^\.\//, "");
            if (
              !clean ||
              clean.startsWith("/") ||
              clean.toLowerCase() === "data.json" ||
              clean.split("/").some((seg) => !seg || seg === ".." || seg.startsWith("."))
            ) {
              throw new Error(`SECURITY VIOLATION: Unsafe file path "${rawFile}" in entry.files.`);
            }
            return clean;
          }

          async function validateAll() {
            const prAuthor = (process.env.PR_AUTHOR || "").toLowerCase().trim();
            const prNumber = process.env.PR_NUMBER;
            const headSha = process.env.PR_HEAD_SHA;
            const repoFullName = process.env.REPO_FULL_NAME;

            const headers = {
              "User-Agent": "Mirage-Gatekeeper",
              "Accept": "application/vnd.github.v3+json",
              "Authorization": `Bearer ${process.env.GITHUB_TOKEN}`
            };

            const filesRes = await fetch(`https://api.github.com/repos/${repoFullName}/pulls/${prNumber}/files?per_page=100`, { headers });
            if (!filesRes.ok) {
              throw new Error(`Failed to fetch PR files (HTTP ${filesRes.status}: ${filesRes.statusText}).`);
            }
            const changedFiles = (await filesRes.json()).map(f => f.filename);

            const latestMirageVersion = await getLatestMirageVersion(headers);
            console.log(`Latest Mirage Editor release: v${latestMirageVersion}`);

            for (const file of changedFiles) {
              console.log(`\nInspecting ${file}...`);
              const rawFileRes = await fetch(
                `https://api.github.com/repos/${repoFullName}/contents/${file.split("/").map(encodeURIComponent).join("/")}?ref=${encodeURIComponent(headSha)}`,
                {
                  headers: {
                    ...headers,
                    "Accept": "application/vnd.github.raw+json"
                  }
                }
              );
              if (!rawFileRes.ok) {
                throw new Error(`Failed to read ${file} from PR head ${headSha} (HTTP ${rawFileRes.status}).`);
              }

              const raw = await rawFileRes.text();
              const entry = JSON.parse(raw);

              const requiredFields = ["id", "name", "author", "version", "appVersion", "repo", "releaseTag", "description", "hash"];
              for (const field of requiredFields) {
                if (!entry[field]) {
                  throw new Error(`Missing required field "${field}" in ${file}`);
                }
              }

              const expectedId = path.basename(file, ".json");
              if (String(entry.author).toLowerCase().trim() !== prAuthor) {
                throw new Error(`SECURITY VIOLATION in ${file}: entry.author ("${entry.author}") must match PR author "@${prAuthor}".`);
              }
              if (String(entry.id).trim() !== expectedId) {
                throw new Error(`VALIDATION ERROR in ${file}: entry.id ("${entry.id}") must match filename "${expectedId}".`);
              }
              if (!String(entry.repo).toLowerCase().startsWith(`${prAuthor}/`)) {
                throw new Error(`SECURITY VIOLATION in ${file}: entry.repo ("${entry.repo}") must be owned by "@${prAuthor}".`);
              }

              if (compareSemver(entry.appVersion, latestMirageVersion) < 0) {
                throw new Error(
                  `VERSION VIOLATION in ${file}: Submitted from Mirage Editor v${entry.appVersion}, but latest release is v${latestMirageVersion}. Please update Mirage Editor before publishing.`
                );
              }
              console.log(`✔ App version verified: v${entry.appVersion} >= v${latestMirageVersion}`);

              const releaseUrl = `https://api.github.com/repos/${entry.repo}/releases/tags/${encodeURIComponent(entry.releaseTag)}`;
              console.log(`Checking release: ${releaseUrl}`);

              const res = await fetch(releaseUrl, { headers });
              if (!res.ok) {
                throw new Error(`Could not find GitHub Release tag "${entry.releaseTag}" on ${entry.repo} (HTTP ${res.status}: ${res.statusText}).`);
              }

              const releaseData = await res.json();
              const assets = releaseData.assets || [];
              const assetNames = assets.map(a => a.name);
              console.log(`Found release assets: ${assetNames.join(", ")}`);

              const mainJsAsset = assets.find(a => a.name === "main.js" || a.name.endsWith(".main.js"));
              if (!mainJsAsset) {
                throw new Error(`Release "${entry.releaseTag}" does not contain a "main.js" asset.`);
              }

              const filesToCheck = Array.isArray(entry.files) && entry.files.length > 0
                ? entry.files.map(validateRelativePath)
                : ["main.js"];
              if (!filesToCheck.includes("main.js")) {
                filesToCheck.unshift("main.js");
              }

              let combinedJsCode = "";

              for (const relPath of filesToCheck) {
                const expectedAssetName = relPath.includes("/") ? relPath.replace(/\//g, "__") : relPath;
                const asset = relPath === "main.js" ? mainJsAsset : assets.find(a => a.name === expectedAssetName);
                if (!asset) {
                  throw new Error(`Release "${entry.releaseTag}" is missing declared asset "${expectedAssetName}" (for ${relPath}).`);
                }

                console.log(`Downloading and verifying ${relPath} (${asset.name})...`);
                const fileRes = await fetch(asset.browser_download_url);
                if (!fileRes.ok) {
                  throw new Error(`Failed to download ${asset.name} (HTTP ${fileRes.status}).`);
                }
                const fileBuf = Buffer.from(await fileRes.arrayBuffer());
                const fileSha = crypto.createHash("sha256").update(fileBuf).digest("hex").toLowerCase();

                if (relPath === "main.js" && fileSha !== String(entry.hash).trim().toLowerCase()) {
                  throw new Error(
                    `INTEGRITY VIOLATION in ${file}: SHA-256 of main.js (${fileSha}) does not match entry.hash (${entry.hash}).`
                  );
                }
                if (entry.fileHashes && entry.fileHashes[relPath]) {
                  const declared = String(entry.fileHashes[relPath]).trim().toLowerCase();
                  if (fileSha !== declared) {
                    throw new Error(
                      `INTEGRITY VIOLATION in ${file}: SHA-256 of ${relPath} (${fileSha}) does not match entry.fileHashes["${relPath}"] (${declared}).`
                    );
                  }
                }
                console.log(`✔ SHA-256 verified for ${relPath}: ${fileSha}`);

                if (/\.(js|cjs)$/i.test(relPath)) {
                  const jsCode = fileBuf.toString("utf-8");
                  scanSecurity(jsCode, `${entry.id}/${relPath}`);
                  combinedJsCode += `\n// ${relPath}\n${jsCode}`;
                }
              }

              console.log(`✔ Security scan passed across all JS files for ${entry.id}`);

              const derived = deriveCapabilities(combinedJsCode);
              console.log(`Derived capabilities: ${derived.join(", ")}`);

              if (derived.includes("network-access") && entry.capabilities && entry.capabilities.includes("vault-only")) {
                throw new Error(`CAPABILITY MISMATCH: Extension "${entry.id}" uses network requests but claims "vault-only" capability.`);
              }
            }

            console.log("\n✔ All app version checks, multi-file SHA-256 integrity checks, security scans, and release asset verifications passed!");
          }

          validateAll().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          EOF
          node scan_security.js
          rm scan_security.js

      - name: Approve and Auto-Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "Approving PR..."
          gh pr review "$PR_URL" --approve --body "✅ **Automated Security Scan Passed**: Identity verified, app version confirmed, multi-file SHA-256 integrity verified, release assets validated, and AST scan clean. Auto-merging into catalog."
          echo "Merging PR..."
          gh pr merge "$PR_URL" --squash || gh pr merge "$PR_URL" --squash --auto

  # ===========================================================================
  # JOB 2: Compile SQLite (FTS5) & Upload to `catalog-latest` GitHub Release
  # ===========================================================================
  build-catalog:
    needs: [validate-and-merge]
    if: |
      always() && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request_target' && needs.validate-and-merge.result == 'success')
      )
    concurrency:
      group: build-catalog
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js & SQLite
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install SQLite3 CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Compile catalog.sqlite (FTS5 + Blocklist Table)
        run: |
          cat << 'EOF' > compile_catalog.js
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");

          const authorsDir = "authors";
          const registry = [];

          if (fs.existsSync(authorsDir)) {
            for (const authorFolder of fs.readdirSync(authorsDir, { withFileTypes: true })) {
              if (!authorFolder.isDirectory() || authorFolder.name.startsWith(".")) continue;
              const aPath = path.join(authorsDir, authorFolder.name);

              for (const file of fs.readdirSync(aPath)) {
                if (!file.endsWith(".json")) continue;
                try {
                  const entry = JSON.parse(fs.readFileSync(path.join(aPath, file), "utf-8"));
                  registry.push(entry);
                } catch (e) {
                  console.warn(`Failed to parse ${file}:`, e);
                }
              }
            }
          }

          registry.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

          const dbPath = "catalog.sqlite";
          if (fs.existsSync(dbPath)) fs.unlinkSync(dbPath);

          const sqlStatements = [
            "PRAGMA journal_mode = OFF;",
            "PRAGMA synchronous = 0;",
            "BEGIN TRANSACTION;",
            `CREATE TABLE extensions (
              id TEXT NOT NULL,
              name TEXT,
              author TEXT NOT NULL,
              version TEXT,
              description TEXT,
              repo TEXT,
              release_tag TEXT,
              capabilities TEXT,
              search_keywords TEXT,
              downloads INTEGER DEFAULT 0,
              hash TEXT,
              files TEXT,
              file_hashes TEXT,
              updated_at INTEGER,
              PRIMARY KEY (author, id)
            );`,
            "CREATE INDEX idx_extensions_downloads ON extensions(downloads DESC);",
            "CREATE INDEX idx_extensions_updated ON extensions(updated_at DESC);",
            "CREATE INDEX idx_extensions_author ON extensions(author);",
            `CREATE VIRTUAL TABLE extensions_fts USING fts5(
              id, name, author, description, search_keywords, capabilities,
              content='extensions', content_rowid='rowid'
            );`,
            `CREATE TABLE IF NOT EXISTS blocklist (
              id TEXT PRIMARY KEY,
              reason TEXT,
              created_at INTEGER
            );`
          ];

          const esc = (s) => String(s || "").replace(/'/g, "''");

          for (const item of registry) {
            const capsStr = esc((item.capabilities || []).join(", "));
            const kwStr = esc((item.searchKeywords || []).join(", "));
            const desc = esc(item.description);
            const name = esc(item.name);
            const id = esc(item.id);
            const author = esc(item.author);
            const repo = esc(item.repo);
            const releaseTag = esc(item.releaseTag);
            const version = esc(item.version);
            const hash = esc(item.hash);
            const filesJson = esc(JSON.stringify(item.files || []));
            const fileHashesJson = esc(JSON.stringify(item.fileHashes || {}));
            const updatedAt = item.updatedAt || Date.now();
            const downloads = item.downloads || 0;

            sqlStatements.push(`
              INSERT INTO extensions (id, name, author, version, description, repo, release_tag, capabilities, search_keywords, downloads, hash, files, file_hashes, updated_at)
              VALUES ('${id}', '${name}', '${author}', '${version}', '${desc}', '${repo}', '${releaseTag}', '${capsStr}', '${kwStr}', ${downloads}, '${hash}', '${filesJson}', '${fileHashesJson}', ${updatedAt});
              INSERT INTO extensions_fts(rowid, id, name, author, description, search_keywords, capabilities)
              VALUES (last_insert_rowid(), '${id}', '${name}', '${author}', '${desc}', '${kwStr}', '${capsStr}');
            `);
          }

          if (fs.existsSync("blocklist.txt")) {
            const lines = fs.readFileSync("blocklist.txt", "utf-8").split("\n").map(l => l.trim()).filter(Boolean);
            for (const blockedId of lines) {
              const cleanId = esc(blockedId);
              sqlStatements.push(`INSERT OR IGNORE INTO blocklist (id, reason, created_at) VALUES ('${cleanId}', 'Revoked', ${Date.now()});`);
            }
          }

          sqlStatements.push("COMMIT;");

          fs.writeFileSync("build_catalog.sql", sqlStatements.join("\n"), "utf-8");
          execSync(`sqlite3 ${dbPath} < build_catalog.sql`);
          fs.unlinkSync("build_catalog.sql");

          console.log(`✔ Compiled catalog.sqlite with ${registry.length} extensions, FTS5 index, and blocklist table.`);
          EOF
          node compile_catalog.js
          rm compile_catalog.js

      - name: Publish catalog.sqlite to catalog-latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view catalog-latest >/dev/null 2>&1; then
            gh release upload catalog-latest catalog.sqlite --clobber
          else
            gh release create catalog-latest catalog.sqlite \
              --title "Extension Catalog (Latest)" \
              --notes "Auto-compiled SQLite (FTS5) extension catalog for Mirage Editor."
          fi
