name: Generate Registry Catalog

on:
  push:
    branches: [ main ]
    paths:
      - 'plugins/**'
      - 'scripts/**'

jobs:
  build-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build registry.json from folders
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          const registry = [];

          // 1. Scan plugins/
          if (fs.existsSync("plugins")) {
            const pluginDirs = fs.readdirSync("plugins", { withFileTypes: true })
              .filter(d => d.isDirectory() && !d.name.startsWith("."));

            for (const dir of pluginDirs) {
              const manifestPath = path.join("plugins", dir.name, "manifest.json");
              if (fs.existsSync(manifestPath)) {
                const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf-8"));
                const files = fs.readdirSync(path.join("plugins", dir.name))
                  .filter(f => !f.startsWith("."));

                registry.push({
                  id: manifest.id || dir.name,
                  name: manifest.name || dir.name,
                  author: manifest.author || "Julian Ventura",
                  version: manifest.version || "1.0.0",
                  type: "plugin",
                  description: manifest.description || "",
                  repo: "VenturaNotes/mirage-editor-extensions",
                  branch: "main",
                  path: `plugins/${dir.name}`,
                  files: files,
                  capabilities: manifest.capabilities || ["vault-only"]
                });
              }
            }
          }

          // 2. Scan scripts/
          if (fs.existsSync("scripts")) {
            const scriptFiles = fs.readdirSync("scripts")
              .filter(f => f.endsWith(".js") && !f.startsWith("."));

            for (const file of scriptFiles) {
              const baseName = path.basename(file, ".js");
              registry.push({
                id: baseName.toLowerCase().replace(/[^a-z0-9_-]/g, "-"),
                name: baseName.replace(/[-_]/g, " "),
                author: "Julian Ventura",
                version: "1.0.0",
                type: "script",
                description: `User script: ${file}`,
                repo: "VenturaNotes/mirage-editor-extensions",
                branch: "main",
                path: `scripts/${file}`,
                file: file,
                capabilities: ["vault-only"]
              });
            }
          }

          fs.writeFileSync("registry.json", JSON.stringify(registry, null, 2), "utf-8");
          console.log(`✓ Generated registry.json with ${registry.length} entries.`);
          '

      - name: Commit & Push updated registry.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add registry.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update registry.json [skip ci]"
          git push
