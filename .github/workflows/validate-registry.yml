name: Generate Registry Catalog & AI Summarizer

on:
  push:
    branches: [ main ]
    paths:
      - 'extensions/**'

jobs:
  build-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build registry.json with SHA-256 Hashes & AI Summaries
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const crypto = require("crypto");

          const GEMINI_API_KEY = process.env.GEMINI_API_KEY;
          const IS_MAIN = process.env.GITHUB_REF === "refs/heads/main";

          // 2-Tier Cascade: Flash-Lite 3.5 -> Flash-Lite 3.1
          const MODEL_CASCADE = [
            { id: "gemini-3.5-flash-lite", name: "Gemini 3.5 Flash-Lite" },
            { id: "gemini-3.1-flash-lite", name: "Gemini 3.1 Flash-Lite" }
          ];

          function computeSha256(content) {
            return crypto.createHash("sha256").update(content).digest("hex");
          }

          function detectCapabilities(code) {
            const caps = new Set();
            if (/\bfetch\s*\(|\bhttps?:|\bWebSocket\s*\(|\bXMLHttpRequest\b/.test(code)) caps.add("network");
            if (/\bchild_process\b|\bexec\s*\(|\bspawn\s*\(|\bnode-pty\b/.test(code)) caps.add("shell");
            if (/\bnew\s+Audio\b|\bAudioContext\b|["\x27\x60]audio\//.test(code)) caps.add("audio");
            if (/\bclipboard\.(read|write)|\bnavigator\.clipboard\b/.test(code)) caps.add("clipboard");
            if (/statusBar\.addItem/.test(code)) caps.add("status-bar");
            if (/writeFile|readFile|unlink/.test(code)) caps.add("vault-write");
            if (!caps.has("network") && !caps.has("shell")) caps.add("vault-only");
            return Array.from(caps);
          }

          // Security Scanner: Flag and block remote dynamic execution
          function scanSecurity(code, filename) {
            if (/import\s*\(\s*["\x27]https?:\/\//i.test(code)) {
              throw new Error(`SECURITY VIOLATION in ${filename}: Dynamic remote import detected (e.g. import("https://...")). External dependencies must be bundled or vendored.`);
            }
            if (/eval\s*\(\s*(await\s+)?fetch\s*\(/i.test(code)) {
              throw new Error(`SECURITY VIOLATION in ${filename}: Remote fetch-to-eval execution detected.`);
            }
          }

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function summarizeWithCascade(name, author, type, fullCode, manifestDesc) {
            if (!GEMINI_API_KEY) {
              if (IS_MAIN) {
                console.error("FATAL: GEMINI_API_KEY is not set on main branch.");
                process.exit(1);
              }
              return null;
            }

            const prompt = `You are the catalog compiler for Mirage Editor extensions.
Analyze this source code for a ${type} named "${name}" by author "${author}".
Manifest description (if any): "${manifestDesc || ''}"

Source Code:
${fullCode.slice(0, 24000)}

Respond strictly with a JSON object:
{
  "description": "Crisp 1-2 sentence overview for extension cards (max 160 chars)",
  "readme": "# ${name}\\n\\nDetailed markdown documentation explaining: Overview, How It Works, Usage/Triggers, Requirements/Configuration.",
  "searchKeywords": ["keyword1", "keyword2", "keyword3"],
  "capabilities": ["vault-only", "vault-write", "ui-modal", "shell-trash", "audio", "status-bar"],
  "actions": ["discrete-action-1", "discrete-action-2"],
  "scope": "active-note",
  "inputs": "What environment inputs or active notes it requires",
  "outputs": "What files, artifacts, or state it produces"
}`;

            for (let mIdx = 0; mIdx < MODEL_CASCADE.length; mIdx++) {
              const model = MODEL_CASCADE[mIdx];
              const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model.id}:generateContent?key=${GEMINI_API_KEY}`;
              const maxAttempts = 3;

              for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                try {
                  console.log(`[AI Summarizer] Querying ${model.name} for "${name}" (attempt ${attempt}/${maxAttempts})...`);
                  const res = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                      contents: [{ parts: [{ text: prompt }] }],
                      generationConfig: { responseMimeType: "application/json" }
                    })
                  });

                  if (res.status === 429) {
                    if (mIdx < MODEL_CASCADE.length - 1) break;
                    await sleep(Math.min(3000 * attempt, 15000));
                    continue;
                  }

                  if (res.status >= 500) {
                    if (attempt < maxAttempts) {
                      await sleep(2000 * attempt);
                      continue;
                    } else if (mIdx < MODEL_CASCADE.length - 1) {
                      break;
                    }
                  }

                  if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);

                  const data = await res.json();
                  const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                  if (rawText) {
                    const parsed = JSON.parse(rawText);
                    console.log(`✓ Succeeded with ${model.name} for "${name}"`);
                    return parsed;
                  }
                } catch (err) {
                  console.warn(`[AI Summarizer] Error on ${model.name} (attempt ${attempt}): ${err.message}`);
                  if (attempt < maxAttempts) await sleep(2000 * attempt);
                }
              }
            }

            if (IS_MAIN) {
              console.error(`FATAL: AI summarization failed for "${name}" across all model tiers on main branch.`);
              process.exit(1);
            }
            return null;
          }

          async function main() {
            const registry = [];
            const baseDir = "extensions";

            if (fs.existsSync(baseDir)) {
              const authorDirs = fs.readdirSync(baseDir, { withFileTypes: true })
                .filter(d => d.isDirectory() && !d.name.startsWith("."));

              for (const aDir of authorDirs) {
                const author = aDir.name.toLowerCase();
                const aPath = path.join(baseDir, aDir.name);

                for (const item of fs.readdirSync(aPath, { withFileTypes: true })) {
                  if (item.name.startsWith(".")) continue;

                  // 1. Folder Package Extension
                  if (item.isDirectory()) {
                    const pDir = path.join(aPath, item.name);
                    const mainJsPath = path.join(pDir, "main.js");
                    const manifestPath = path.join(pDir, "manifest.json");

                    if (fs.existsSync(mainJsPath)) {
                      const mainCode = fs.readFileSync(mainJsPath, "utf-8");
                      scanSecurity(mainCode, `${author}/${item.name}/main.js`);

                      let manifest = { id: item.name, name: item.name, version: "1.0.0" };
                      if (fs.existsSync(manifestPath)) {
                        try { manifest = JSON.parse(fs.readFileSync(manifestPath, "utf-8")); } catch (_) {}
                      }

                      const files = fs.readdirSync(pDir).filter(f => !f.startsWith("."));
                      let combinedContent = mainCode;
                      for (const f of files) {
                        if (f !== "main.js") {
                          try { combinedContent += fs.readFileSync(path.join(pDir, f), "utf-8"); } catch (_) {}
                        }
                      }
                      const hash = computeSha256(combinedContent);

                      const caps = detectCapabilities(mainCode);
                      const aiResult = await summarizeWithCascade(manifest.name || item.name, author, "plugin", mainCode, manifest.description);

                      registry.push({
                        id: item.name,
                        name: manifest.name || item.name,
                        author: author,
                        version: manifest.version || "1.0.0",
                        type: "plugin",
                        description: aiResult?.description || manifest.description || `Extension: ${manifest.name || item.name}`,
                        readme: aiResult?.readme || `# ${manifest.name || item.name}\n\nExtension by @${author}`,
                        repo: "VenturaNotes/mirage-editor-extensions",
                        branch: "main",
                        path: `extensions/${author}/${item.name}`,
                        files: files,
                        hash: hash,
                        capabilities: aiResult?.capabilities || caps,
                        actions: aiResult?.actions || [],
                        searchKeywords: aiResult?.searchKeywords || [],
                        scope: aiResult?.scope || "app-shell",
                        inputs: aiResult?.inputs || "",
                        outputs: aiResult?.outputs || ""
                      });
                    }
                  }

                  // 2. Single-File Extension (.js)
                  else if (item.isFile() && item.name.endsWith(".js")) {
                    const filePath = path.join(aPath, item.name);
                    const scriptCode = fs.readFileSync(filePath, "utf-8");
                    scanSecurity(scriptCode, `${author}/${item.name}`);

                    const baseName = path.basename(item.name, ".js");
                    const hash = computeSha256(scriptCode);

                    const caps = detectCapabilities(scriptCode);
                    const aiResult = await summarizeWithCascade(baseName, author, "script", scriptCode, "");

                    registry.push({
                      id: baseName.toLowerCase().replace(/[^a-z0-9_-]/g, "-"),
                      name: baseName.replace(/[-_]/g, " "),
                      author: author,
                      version: "1.0.0",
                      type: "script",
                      description: aiResult?.description || `Extension script: ${item.name}`,
                      readme: aiResult?.readme || `# ${baseName}\n\nExtension script by @${author}`,
                      repo: "VenturaNotes/mirage-editor-extensions",
                      branch: "main",
                      path: `extensions/${author}/${item.name}`,
                      file: item.name,
                      hash: hash,
                      capabilities: aiResult?.capabilities || caps,
                      actions: aiResult?.actions || [],
                      searchKeywords: aiResult?.searchKeywords || [],
                      scope: aiResult?.scope || "active-note",
                      inputs: aiResult?.inputs || "",
                      outputs: aiResult?.outputs || ""
                    });
                  }
                }
              }
            }

            fs.writeFileSync("registry.json", JSON.stringify(registry, null, 2), "utf-8");
            console.log(`✓ Generated registry.json with ${registry.length} entries.`);
          }

          main();
          '

      - name: Commit & Push updated catalog
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add registry.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update registry with SHA-256 hashes & AI summaries [skip ci]"
          git push
