name: Generate Registry Catalog with Capability & Intent Footprints

on:
  push:
    branches: [ main ]
    paths:
      - 'plugins/**'
      - 'scripts/**'

jobs:
  build-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build registry.json with Semantic Footprints
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          // Extract commands registered via this.addCommand
          function extractCommands(code) {
            const cmds = [];
            const regex = /name\\s*:\\s*["\x27\`]([^"\x27\`]+)["\x27\`]/g;
            let m;
            while ((m = regex.exec(code)) !== null) {
              if (!cmds.includes(m[1].trim())) cmds.push(m[1].trim());
            }
            return cmds;
          }

          // Automated capability & feature token classification
          function analyzeCode(code) {
            const caps = new Set();
            const features = new Set();

            const hasNetwork = /\bfetch\s*\(|\bhttps?\.|\bWebSocket\s*\(|\bXMLHttpRequest\b|\bnet\./.test(code);
            const hasShell = /\bchild_process\b|\bexec\s*\(|\bspawn\s*\(|\bnode-pty\b|\bexecSync\b/.test(code);
            const hasAudio = /\bnew\s+Audio\b|\bAudioContext\b|\bwebkitAudioContext\b|["\x27\x60]audio\//.test(code);
            const hasClipboard = /\bclipboard\.(read|write)|\bnavigator\.clipboard\b/.test(code);
            const hasStatusBar = /statusBar\.addItem/.test(code);
            const hasSettings = /addSettingTab/.test(code);

            if (hasNetwork) caps.add("network");
            if (hasShell) caps.add("shell");
            if (hasAudio) { caps.add("audio"); features.add("audio playback"); features.add("music player"); }
            if (hasClipboard) caps.add("clipboard");
            if (hasStatusBar) { caps.add("status-bar"); features.add("status bar controls"); }
            if (hasSettings) caps.add("settings");

            if (!hasNetwork && !hasShell) caps.add("vault-only");

            // Look for common feature keywords in code comments and strings
            const keywords = ["album", "playlist", "queue", "tag", "counter", "sort", "timer", "clock", "canvas", "drawing", "sync", "calendar", "task", "todo"];
            const lowerCode = code.toLowerCase();
            for (const kw of keywords) {
              if (lowerCode.includes(kw)) features.add(kw);
            }

            return {
              capabilities: Array.from(caps),
              features: Array.from(features)
            };
          }

          const registry = [];

          // 1. Scan plugins/
          if (fs.existsSync("plugins")) {
            const pluginDirs = fs.readdirSync("plugins", { withFileTypes: true })
              .filter(d => d.isDirectory() && !d.name.startsWith("."));

            for (const dir of pluginDirs) {
              const pluginPath = path.join("plugins", dir.name);
              const manifestPath = path.join(pluginPath, "manifest.json");
              const mainJsPath = path.join(pluginPath, "main.js");

              if (fs.existsSync(manifestPath)) {
                const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf-8"));
                const mainCode = fs.existsSync(mainJsPath) ? fs.readFileSync(mainJsPath, "utf-8") : "";
                const files = fs.readdirSync(pluginPath).filter(f => !f.startsWith("."));

                const analysis = analyzeCode(mainCode);
                const commands = extractCommands(mainCode);

                registry.push({
                  id: manifest.id || dir.name,
                  name: manifest.name || dir.name,
                  author: manifest.author || "Julian Ventura",
                  version: manifest.version || "1.0.0",
                  type: "plugin",
                  description: manifest.description || "",
                  repo: "VenturaNotes/mirage-editor-extensions",
                  branch: "main",
                  path: `plugins/${dir.name}`,
                  files: files,
                  capabilities: analysis.capabilities,
                  features: analysis.features,
                  commands: commands
                });
              }
            }
          }

          // 2. Scan scripts/
          if (fs.existsSync("scripts")) {
            const scriptFiles = fs.readdirSync("scripts")
              .filter(f => f.endsWith(".js") && !f.startsWith("."));

            for (const file of scriptFiles) {
              const filePath = path.join("scripts", file);
              const scriptCode = fs.readFileSync(filePath, "utf-8");
              const baseName = path.basename(file, ".js");

              const analysis = analyzeCode(scriptCode);

              registry.push({
                id: baseName.toLowerCase().replace(/[^a-z0-9_-]/g, "-"),
                name: baseName.replace(/[-_]/g, " "),
                author: "Julian Ventura",
                version: "1.0.0",
                type: "script",
                description: `User script: ${file}`,
                repo: "VenturaNotes/mirage-editor-extensions",
                branch: "main",
                path: `scripts/${file}`,
                file: file,
                capabilities: analysis.capabilities,
                features: analysis.features,
                commands: [baseName]
              });
            }
          }

          fs.writeFileSync("registry.json", JSON.stringify(registry, null, 2), "utf-8");
          console.log(`✓ Generated registry.json with ${registry.length} enriched entries.`);
          '

      - name: Commit & Push updated registry.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add registry.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update registry.json with semantic footprints [skip ci]"
          git push
